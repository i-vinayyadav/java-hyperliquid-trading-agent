spring.application.name=hyperliquid-trading-agent
server.port=8080

# Hyperliquid Configuration
HYPERLIQUID_PRIVATE_KEY=Your-Key
MNEMONIC=your_mnemonic_phrase_here
HYPERLIQUID_BASE_URL=https://api.hyperliquid.xyz
HYPERLIQUID_NETWORK=mainnet
HYPERLIQUID_VAULT_ADDRESS=Your-Key

# LLM Configuration - Google Gemini API
GOOGLE_API_KEY=Your-Key
LLM_MODEL=gemini-flash-latest
SANITIZE_MODEL=gemini-flash-latest
MAX_TOKENS=16384
ENABLE_TOOL_CALLING=false

# Extended Thinking (Claude)
THINKING_ENABLED=false
THINKING_BUDGET_TOKENS=10000

# Runtime Controls
ASSETS=BTC,ETH,USDC
INTERVAL=5m

# Risk Management
MAX_POSITION_PCT=20
MAX_LOSS_PER_POSITION_PCT=20
MAX_LEVERAGE=10
MAX_TOTAL_EXPOSURE_PCT=80
DAILY_LOSS_CIRCUIT_BREAKER_PCT=25
MANDATORY_SL_PCT=5
MAX_CONCURRENT_POSITIONS=10
MIN_BALANCE_RESERVE_PCT=10

# API Server
API_HOST=0.0.0.0
APP_PORT=3000

# Legacy / Optional
TAAPI_API_KEY=your_taapi_api_key_here
OPENROUTER_API_KEY=your_openrouter_api_key_here

# CoinDCX Configuration
COINDCX_API_KEY=Your-Key
COINDCX_API_SECRET=Your-Key
COINDCX_BASE_URL=https://api.coindcx.com
